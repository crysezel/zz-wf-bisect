name: c-d
on: workflow_dispatch
permissions:
  contents: read
  issues: write
  pull-requests: write
  id-token: write
jobs:
  review:
    uses: ./.github/workflows/r-d.yml
    with:
      claude_model: claude-opus-4-6
      max_turns: 60
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
